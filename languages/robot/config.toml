name = "Robot Framework"
grammar = "robot"
path_suffixes = ["robot", "resource"]
line_comments = ["# "]
tab_size = 4
debuggers = ["RobotCode"]
hard_tabs = false
word_characters = ["$", "@", "&", "%", "{", "}"]
brackets = [
  { start = "{", end = "}", close = true, newline = false },
  { start = "[", end = "]", close = true, newline = false },
  { start = "(", end = ")", close = true, newline = false },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
  { start = "'", end = "'", close = true, newline = false, not_in = ["string"] },
]
