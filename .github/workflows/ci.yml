name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  extension:
    name: Build extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --target wasm32-wasip2 -- -D warnings

      - name: Unit tests
        run: cargo test

      - name: Build (as Zed does)
        run: cargo build --release --target wasm32-wasip2

  queries:
    name: Tree-sitter queries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install tree-sitter CLI
        run: npm install --global tree-sitter-cli@0.27.0

      - name: Check queries against the pinned grammar
        run: ./scripts/check-queries.sh
