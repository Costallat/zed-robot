name: Release

# Pushing a tag vX.Y.Z publishes a GitHub release with that version's section
# of CHANGELOG.md as its notes. See "Releasing" in the README.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Tag matches extension.toml, Cargo.toml and CHANGELOG.md
        run: |
          ./scripts/check-version.sh
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' extension.toml | head -n 1)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match extension.toml version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Release notes from CHANGELOG.md
        run: |
          # The lines after "## <version> - <date>", up to the next "## ".
          awk -v heading="## $VERSION " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no notes for $VERSION"
            exit 1
          fi
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$VERSION" --notes-file notes.md --verify-tag
